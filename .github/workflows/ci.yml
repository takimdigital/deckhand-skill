# Deckhand v2 CI — every suite is offline (registry responses are recorded fixtures).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is the owner's host: a red Windows run fails CI like Ubuntu (blocking since the 2026-09-29 audit).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: git identity (tests create repos)
        run: git config --global user.email ci@localhost && git config --global user.name ci
      - name: dh control plane (unittest, stdlib)
        run: python -m unittest discover -s skills/deckhand/tests -v
      - name: ops scripts (Coolify / backups / Hostinger clients)
        run: python -m pip install -q pytest && python -m pytest skills/deckhand/ops/tests -q
      - name: try-on engine (node --test, offline fixtures)
        run: node --test skills/deckhand/tryon/test/*.test.mjs
      - name: try-on playground (source-only snapshot: every import resolves, no local path)
        run: node --test playground/playground.test.mjs
      - name: version consistency
        run: python scripts/version_check.py
      - name: community workflows (strict lint + fresh index)
        run: python scripts/workflows_index.py --check
      - name: repo scripts (LLM_CONTEXT generator)
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: LLM_CONTEXT.md is fresh (main is regenerated by llm-context.yml)
        if: github.ref != 'refs/heads/main'
        run: python scripts/llm_context.py --check
